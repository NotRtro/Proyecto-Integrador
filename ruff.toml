# Formato y lint del código Python (paso 9.1). Se conservan las comillas existentes.
line-length = 120
target-version = "py311"
extend-exclude = ["frontend", "data", "artifacts", ".venv"]

[format]
quote-style = "preserve"

[lint]
select = ["E", "F", "W", "I"]
ignore = ["E731"]

[lint.isort]
known-first-party = ["src", "api"]

[lint.per-file-ignores]
# El código de las celdas del cuaderno va dentro de cadenas: se mide con el ancho del cuaderno, no del módulo.
"scripts/build_notebook.py" = ["E501"]
